name: Check ONE VOICE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check main.js
          node --check road-animation.js
          node --check functions/index.js
          node --check functions/counter-shards.js
          node --check firebase-config.js
      - name: Verify 10,000-signature counter distribution
        run: node --test functions/counter-shards.test.js
      - name: Validate main HTML elements
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Audit(HTMLParser):
              def __init__(self): super().__init__();self.ids=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:
                      assert a['id'] not in self.ids, f"Duplicate id: {a['id']}"
                      self.ids.add(a['id'])
          audit=Audit()
          audit.feed(Path('index.html').read_text())
          needed={'cinematicRoad','openSign','signature','submitSign','clearSign','agree','signName','status','modal','success','count','countMirror','wall','share','shareCampaign'}
          assert needed <= audit.ids, f"Missing IDs: {needed-audit.ids}"
          assert 'road-animation.js' in Path('index.html').read_text()
          print('HTML element audit passed')
          PY
